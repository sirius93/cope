id: linkedin_post
platform: linkedin
kind: midform
outputSchema: string
limits:
  maxChars: 3000
  minChars: 400
rules:
  - Open with a hook line that stands alone before the "see more" fold (roughly the first 210 characters).
  - Short paragraphs with line breaks between them, no walls of text.
  - No more than 3 hashtags, placed at the end.
  - End with a question or CTA that invites comments.
