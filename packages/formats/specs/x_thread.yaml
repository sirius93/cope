id: x_thread
platform: x
kind: shortform
outputSchema: string[]
limits:
  maxPostChars: 280
  minPosts: 3
  maxPosts: 12
rules:
  - "Experiment: open on the mechanism/how, not the outcome — that's what earns the reply-chain read."
  - First post must stand alone and hook without "a thread 🧵" clichés.
  - No hashtags except at most one, and only in the last post.
  - Number posts only if there are more than 5.
  - Last post ends with a CTA and links back to the long-form source if one exists.
